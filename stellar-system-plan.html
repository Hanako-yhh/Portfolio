html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;stellar-plan-root&quot;&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;stellar-plan-root&#x27;);
  if (!root) return;

  const storageKey = &#x27;stellar-system-work-plan-v1&#x27;;
  const defaultPlan = [
    {
      id: &#x27;requirements&#x27;,
      done: false,
      phase: &#x27;规划&#x27;,
      title: &#x27;需求与视觉基线&#x27;,
      detail: &#x27;确定恒星系类型、天体数量、真实程度、视觉风格、默认镜头、点击行为与移动端范围。&#x27;,
      acceptance: &#x27;形成天体数据表、交互状态图、视觉参考和可逐项确认的验收清单。&#x27;,
      priority: &#x27;最高&#x27;,
      estimate: &#x27;1–2 天&#x27;
    },
    {
      id: &#x27;foundation&#x27;,
      done: false,
      phase: &#x27;基础&#x27;,
      title: &#x27;三维场景与工程框架&#x27;,
      detail: &#x27;建立 React、TypeScript、Three.js、渲染循环、场景坐标、深空背景和响应式画布。&#x27;,
      acceptance: &#x27;页面稳定显示完整恒星系骨架，窗口变化时构图保持正确。&#x27;,
      priority: &#x27;最高&#x27;,
      estimate: &#x27;2 天&#x27;
    },
    {
      id: &#x27;simulation&#x27;,
      done: false,
      phase: &#x27;核心&#x27;,
      title: &#x27;轨道与时间模拟&#x27;,
      detail: &#x27;使用真实质量、半径、半长轴、偏心率、倾角和周期，完成开普勒轨道、自转与时间倍率。&#x27;,
      acceptance: &#x27;行星位置可复现、长时间运行无明显漂移，支持暂停、加速和重置。&#x27;,
      priority: &#x27;最高&#x27;,
      estimate: &#x27;2–3 天&#x27;
    },
    {
      id: &#x27;star&#x27;,
      done: false,
      phase: &#x27;核心&#x27;,
      title: &#x27;恒星实时渲染&#x27;,
      detail: &#x27;实现表面流动、温度颜色、日冕、耀斑、边缘辉光、粒子和场景主光源。&#x27;,
      acceptance: &#x27;恒星近看具有动态细节，远看仍是明确的视觉中心，曝光不会淹没行星。&#x27;,
      priority: &#x27;高&#x27;,
      estimate: &#x27;2–3 天&#x27;
    },
    {
      id: &#x27;planets&#x27;,
      done: false,
      phase: &#x27;核心&#x27;,
      title: &#x27;行星、卫星与轨道&#x27;,
      detail: &#x27;实现昼夜面、表面材质、大气、云层、行星环、阴影及可配置的天体数据结构。&#x27;,
      acceptance: &#x27;可通过配置增删天体，各天体按照参数公转、自转并保持可识别。&#x27;,
      priority: &#x27;高&#x27;,
      estimate: &#x27;3–4 天&#x27;
    },
    {
      id: &#x27;camera&#x27;,
      done: false,
      phase: &#x27;交互&#x27;,
      title: &#x27;全景相机与拖拽控制&#x27;,
      detail: &#x27;默认显示完整系统，以恒星为轴拖拽旋转；滚轮缩放，并加入阻尼、距离和俯仰限制。&#x27;,
      acceptance: &#x27;桌面端和触控端操作稳定，视角不会穿模或丢失恒星中心。&#x27;,
      priority: &#x27;最高&#x27;,
      estimate: &#x27;2 天&#x27;
    },
    {
      id: &#x27;selection&#x27;,
      done: false,
      phase: &#x27;交互&#x27;,
      title: &#x27;天体选择与镜头旅行&#x27;,
      detail: &#x27;实现悬停提示、点击选中、镜头平滑飞行、行星跟随观察以及返回系统总览。&#x27;,
      acceptance: &#x27;所有可选天体具有明确反馈，镜头状态切换可中断且不会跳变。&#x27;,
      priority: &#x27;高&#x27;,
      estimate: &#x27;2–3 天&#x27;
    },
    {
      id: &#x27;cinematic&#x27;,
      done: false,
      phase: &#x27;视觉&#x27;,
      title: &#x27;电影化后期效果&#x27;,
      detail: &#x27;加入 HDR、Bloom、镜头光晕、暗角、色差、颗粒、星尘、星云和距离相关曝光。&#x27;,
      acceptance: &#x27;形成接近参考网站的深空氛围，并可按画质档位关闭高成本效果。&#x27;,
      priority: &#x27;中&#x27;,
      estimate: &#x27;3–5 天&#x27;
    },
    {
      id: &#x27;hud&#x27;,
      done: false,
      phase: &#x27;界面&#x27;,
      title: &#x27;HUD、参数与声音&#x27;,
      detail: &#x27;展示天体参数、模拟时间、时间倍率、画质和帧率；支持 HUD 开关、参数调整与环境音。&#x27;,
      acceptance: &#x27;数据实时更新，控件和快捷键完整，声音由用户主动开启。&#x27;,
      priority: &#x27;中&#x27;,
      estimate: &#x27;2–3 天&#x27;
    },
    {
      id: &#x27;quality&#x27;,
      done: false,
      phase: &#x27;交付&#x27;,
      title: &#x27;性能优化、测试与部署&#x27;,
      detail: &#x27;实现动态分辨率、画质分档、移动端降级、资源释放、视觉回归和跨浏览器测试。&#x27;,
      acceptance: &#x27;目标设备达到预期帧率，主要交互测试通过，并生成可部署版本。&#x27;,
      priority: &#x27;高&#x27;,
      estimate: &#x27;3–4 天&#x27;
    }
  ];

  const validPhases = [&#x27;规划&#x27;, &#x27;基础&#x27;, &#x27;核心&#x27;, &#x27;交互&#x27;, &#x27;视觉&#x27;, &#x27;界面&#x27;, &#x27;交付&#x27;];
  const validPriorities = [&#x27;最高&#x27;, &#x27;高&#x27;, &#x27;中&#x27;, &#x27;低&#x27;];
  const body = root.querySelector(&#x27;#plan-body&#x27;);
  const progress = root.querySelector(&#x27;#plan-progress&#x27;);
  const percent = root.querySelector(&#x27;#plan-percent&#x27;);
  const focus = root.querySelector(&#x27;#plan-focus&#x27;);
  const message = root.querySelector(&#x27;#plan-message&#x27;);

  const escapeHtml = (value) =&gt; String(value ?? &#x27;&#x27;)
    .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
    .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
    .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
    .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
    .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);

  const loadPlan = () =&gt; {
    try {
      const stored = localStorage.getItem(storageKey);
      const parsed = stored ? JSON.parse(stored) : null;
      return Array.isArray(parsed) &amp;&amp; parsed.length ? parsed : defaultPlan;
    } catch {
      return defaultPlan;
    }
  };

  let plan = loadPlan();

  const save = () =&gt; {
    try {
      localStorage.setItem(storageKey, JSON.stringify(plan));
      message.textContent = &#x27;已自动保存&#x27;;
    } catch {
      message.textContent = &#x27;当前环境无法保存，但本次修改仍然有效&#x27;;
    }
  };

  const options = (items, selected) =&gt; items.map(item =&gt;
    `&lt;option value=&quot;${escapeHtml(item)}&quot;${item === selected ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${escapeHtml(item)}&lt;/option&gt;`
  ).join(&#x27;&#x27;);

  const render = () =&gt; {
    body.innerHTML = plan.map((item, index) =&gt; `
      &lt;tr data-id=&quot;${escapeHtml(item.id)}&quot;&gt;
        &lt;td class=&quot;status-cell&quot;&gt;
          &lt;div class=&quot;form-check&quot;&gt;
            &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; aria-label=&quot;标记 ${escapeHtml(item.title)} 为完成&quot; data-field=&quot;done&quot; ${item.done ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
          &lt;/div&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;phase-${escapeHtml(item.id)}&quot;&gt;阶段&lt;/label&gt;
          &lt;select class=&quot;form-select&quot; id=&quot;phase-${escapeHtml(item.id)}&quot; data-field=&quot;phase&quot;&gt;${options(validPhases, item.phase)}&lt;/select&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;title-${escapeHtml(item.id)}&quot;&gt;工作内容名称&lt;/label&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;title-${escapeHtml(item.id)}&quot; data-field=&quot;title&quot; value=&quot;${escapeHtml(item.title)}&quot;&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;detail-${escapeHtml(item.id)}&quot;&gt;工作内容说明&lt;/label&gt;
          &lt;textarea class=&quot;form-control&quot; id=&quot;detail-${escapeHtml(item.id)}&quot; data-field=&quot;detail&quot;&gt;${escapeHtml(item.detail)}&lt;/textarea&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;acceptance-${escapeHtml(item.id)}&quot;&gt;交付与验收标准&lt;/label&gt;
          &lt;textarea class=&quot;form-control&quot; id=&quot;acceptance-${escapeHtml(item.id)}&quot; data-field=&quot;acceptance&quot;&gt;${escapeHtml(item.acceptance)}&lt;/textarea&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;priority-${escapeHtml(item.id)}&quot;&gt;优先级&lt;/label&gt;
          &lt;select class=&quot;form-select&quot; id=&quot;priority-${escapeHtml(item.id)}&quot; data-field=&quot;priority&quot;&gt;${options(validPriorities, item.priority)}&lt;/select&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;estimate-${escapeHtml(item.id)}&quot;&gt;预计时间&lt;/label&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;estimate-${escapeHtml(item.id)}&quot; data-field=&quot;estimate&quot; value=&quot;${escapeHtml(item.estimate)}&quot;&gt;
        &lt;/td&gt;
        &lt;td&gt;
          &lt;div class=&quot;row-actions&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;up&quot; aria-label=&quot;上移 ${escapeHtml(item.title)}&quot; ${index === 0 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;
              &lt;i data-lucide=&quot;arrow-up&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;down&quot; aria-label=&quot;下移 ${escapeHtml(item.title)}&quot; ${index === plan.length - 1 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;
              &lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;delete&quot; aria-label=&quot;删除 ${escapeHtml(item.title)}&quot;&gt;
              &lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;
          &lt;/div&gt;
        &lt;/td&gt;
      &lt;/tr&gt;
    `).join(&#x27;&#x27;);

    const completed = plan.filter(item =&gt; item.done).length;
    const ratio = plan.length ? Math.round(completed / plan.length * 100) : 0;
    const next = plan.find(item =&gt; !item.done);
    progress.textContent = `${completed} / ${plan.length}`;
    percent.textContent = `${ratio}%`;
    focus.textContent = next ? next.title : &#x27;全部完成&#x27;;
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  };

  root.addEventListener(&#x27;input&#x27;, event =&gt; {
    const field = event.target.dataset.field;
    const row = event.target.closest(&#x27;tr[data-id]&#x27;);
    if (!field || !row) return;
    const item = plan.find(entry =&gt; entry.id === row.dataset.id);
    if (!item) return;
    item[field] = field === &#x27;done&#x27; ? event.target.checked : event.target.value;
    save();
    if (field === &#x27;done&#x27; || field === &#x27;title&#x27;) {
      const completed = plan.filter(entry =&gt; entry.done).length;
      const next = plan.find(entry =&gt; !entry.done);
      progress.textContent = `${completed} / ${plan.length}`;
      percent.textContent = `${plan.length ? Math.round(completed / plan.length * 100) : 0}%`;
      focus.textContent = next ? next.title : &#x27;全部完成&#x27;;
    }
  });

  root.addEventListener(&#x27;change&#x27;, event =&gt; {
    const field = event.target.dataset.field;
    const row = event.target.closest(&#x27;tr[data-id]&#x27;);
    if (!field || !row) return;
    const item = plan.find(entry =&gt; entry.id === row.dataset.id);
    if (!item) return;
    item[field] = field === &#x27;done&#x27; ? event.target.checked : event.target.value;
    save();
    render();
  });

  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const button = event.target.closest(&#x27;button[data-action]&#x27;);
    if (!button) return;
    const row = button.closest(&#x27;tr[data-id]&#x27;);
    const index = plan.findIndex(entry =&gt; entry.id === row.dataset.id);
    if (index &lt; 0) return;
    if (button.dataset.action === &#x27;delete&#x27;) plan.splice(index, 1);
    if (button.dataset.action === &#x27;up&#x27; &amp;&amp; index &gt; 0) [plan[index - 1], plan[index]] = [plan[index], plan[index - 1]];
    if (button.dataset.action === &#x27;down&#x27; &amp;&amp; index &lt; plan.length - 1) [plan[index + 1], plan[index]] = [plan[index], plan[index + 1]];
    save();
    render();
  });

  root.querySelector(&#x27;#add-plan-item&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const id = `custom-${Date.now()}`;
    plan.push({
      id,
      done: false,
      phase: &#x27;规划&#x27;,
      title: &#x27;新阶段&#x27;,
      detail: &#x27;&#x27;,
      acceptance: &#x27;&#x27;,
      priority: &#x27;中&#x27;,
      estimate: &#x27;待定&#x27;
    });
    save();
    render();
    const input = root.querySelector(`#title-${id}`);
    if (input) input.focus();
  });

  root.querySelector(&#x27;#send-plan-feedback&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
    const prompt = `这是我修改后的恒星系网站工作计划。请以这个版本为准继续讨论，并指出需要我进一步确认的关键需求：\n\n${JSON.stringify(plan, null, 2)}`;
    try {
      await navigator.clipboard.writeText(prompt);
      message.textContent = &#x27;修改内容已复制，可直接粘贴到对话中&#x27;;
    } catch {
      message.textContent = &#x27;无法自动发送，请保留当前页面中的修改&#x27;;
    }
  });

  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
